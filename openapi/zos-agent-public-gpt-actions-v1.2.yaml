openapi: 3.1.0
info:
  title: z/OS Agent Elephant Public Knowledge Service
  version: 1.2.0
  description: >-
    Public GPT actions for reading published, privacy-approved knowledge and
    submitting sanitized, generalized, untrusted public evidence.
servers:
  - url: https://{projectRef}.supabase.co/functions/v1
    variables:
      projectRef:
        default: YOUR_PROJECT_REF
        description: Supabase project reference.
paths:
  /knowledge-api:
    get:
      operationId: queryKnowledgeService
      summary: Check health, search public knowledge, or read one public record.
      security:
        - KnowledgeApiKey: []
      parameters:
        - $ref: '#/components/parameters/GetAction'
        - name: q
          in: query
          required: false
          description: Optional search text. Records may match one or more terms; stronger multi-term and exact-phrase matches rank first.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: atomic regression testing
        - name: component
          in: query
          required: false
          description: Optional live component filter.
          schema:
            type: string
            maxLength: 100
        - name: record_type
          in: query
          required: false
          description: Optional record type filter.
          schema:
            type: string
            enum:
              - KNOWLEDGE
              - EXPERIENCE
        - name: id
          in: query
          required: false
          description: Required for record. Live text identifier of the published record.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:/#+-]{0,199}$'
        - name: limit
          in: query
          required: false
          description: Search result limit. The server always caps this at 20.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: Successful health, search, or record response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: submitPublicKnowledgeEvidence
      summary: Submit an untrusted public candidate or public observation.
      description: >-
        Public submissions must be sanitized and generalized and must not
        contain raw evidence. The server owns all trust, privacy, status, and
        maturity attributes.
      security:
        - KnowledgeApiKey: []
      parameters:
        - $ref: '#/components/parameters/PostAction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateCandidateRequest'
                - $ref: '#/components/schemas/AddObservationRequest'
      responses:
        '201':
          description: Candidate or observation accepted as untrusted public evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    KnowledgeApiKey:
      type: apiKey
      in: header
      name: X-ZOS-Knowledge-Key
  parameters:
    GetAction:
      name: action
      in: query
      required: true
      schema:
        type: string
        enum:
          - health
          - search
          - record
    PostAction:
      name: action
      in: query
      required: true
      schema:
        type: string
        enum:
          - create_candidate
          - add_observation
  schemas:
    CreateCandidateRequest:
      type: object
      additionalProperties: false
      required:
        - record_type
        - title
        - component
        - content
        - sanitized
        - generalized
        - raw_evidence_included
      properties:
        record_type:
          type: string
          enum:
            - KNOWLEDGE
            - EXPERIENCE
        title:
          type: string
          minLength: 3
          maxLength: 200
        component:
          type: string
          minLength: 1
          maxLength: 100
        content:
          type: object
          additionalProperties: true
        applicability:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        sanitized:
          type: boolean
          const: true
          description: Client safety declaration only; it is not trusted database state or an RPC provenance parameter.
        generalized:
          type: boolean
          const: true
        raw_evidence_included:
          type: boolean
          const: false
          description: Client safety declaration only; the RPC independently fixes live provenance raw_evidence_included to false.
    AddObservationRequest:
      type: object
      additionalProperties: false
      required:
        - record_id
        - case_fingerprint
        - sanitized
        - generalized
        - raw_evidence_included
      properties:
        record_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/#+-]{0,199}$'
        case_fingerprint:
          type: string
          minLength: 1
          maxLength: 200
        result:
          type: string
          minLength: 1
          maxLength: 8000
        sanitized:
          type: boolean
          const: true
        generalized:
          type: boolean
          const: true
        raw_evidence_included:
          type: boolean
          const: false
    SuccessResponse:
      type: object
      additionalProperties: true
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid or unsafe input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid public Knowledge Service key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Action or public record not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Knowledge Service failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body exceeds the accepted size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Knowledge Service is not configured or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
